name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Testes, integração e cobertura

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    env:
      # ==========================================
      # SPRING BOOT — AMBIENTE DE TESTES
      # ==========================================

      SPRING_PROFILES_ACTIVE: dev

      # ==========================================
      # MICROSSERVIÇO GO — AMBIENTE DE TESTES
      # ==========================================

      # Token fictício exclusivo para CI.
      # Nunca utilizar credenciais reais neste arquivo.
      PAYMENTS_INTERNAL_TOKEN: ci-test-token-not-for-production

      # Os testes devem utilizar mocks ou serviços
      # locais, sem depender do Render.
      PAYMENTS_GO_URL: http://127.0.0.1:8081

      # ==========================================
      # JAVA / MAVEN
      # ==========================================

      MAVEN_OPTS: -Xmx1024m

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================================
      # JAVA
      # ==========================================

      - name: Ler a versão do Java do pom.xml
        id: java
        shell: bash
        run: |
          version=$(sed -n 's:.*<java.version>\(.*\)</java.version>.*:\1:p' pom.xml | head -n 1)

          if [ -z "$version" ]; then
            echo "::error::Não foi possível identificar java.version no pom.xml"
            exit 1
          fi

          echo "Versão do Java: $version"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Instalar o Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: maven

      # ==========================================
      # DOCKER / TESTCONTAINERS
      # ==========================================

      - name: Verificar disponibilidade do Docker
        shell: bash
        run: |
          echo "=========================================="
          echo "VERIFICANDO DOCKER"
          echo "=========================================="

          docker version

          docker info

          echo ""
          echo "Docker disponível."

      # ==========================================
      # MAVEN
      # ==========================================

      - name: Preparar Maven Wrapper
        shell: bash
        run: |
          chmod +x ./mvnw

          ./mvnw --version

      # ==========================================
      # VALIDAR CONFIGURAÇÕES
      # ==========================================

      - name: Validar variáveis obrigatórias
        shell: bash
        run: |
          echo "=========================================="
          echo "VALIDANDO AMBIENTE DE TESTES"
          echo "=========================================="

          required_vars=(
            SPRING_PROFILES_ACTIVE
            PAYMENTS_INTERNAL_TOKEN
            PAYMENTS_GO_URL
          )

          for var in "${required_vars[@]}"; do

            if [ -z "${!var:-}" ]; then
              echo "::error::$var não está configurada."
              exit 1
            fi

            echo "$var configurada."

          done

          echo ""
          echo "Configurações obrigatórias disponíveis."

      # ==========================================
      # TESTES / INTEGRAÇÃO / COBERTURA
      # ==========================================

      - name: Rodar testes e cobertura
        shell: bash
        run: |
          echo "=========================================="
          echo "EXECUTANDO TESTES DA TICKETFY"
          echo "=========================================="

          ./mvnw -B clean verify

      # ==========================================
      # VALIDAR DOCUMENTAÇÃO GERADA
      # ==========================================

      - name: Conferir documentação gerada
        shell: bash
        run: |
          echo "=========================================="
          echo "VALIDANDO DOCUMENTAÇÃO"
          echo "=========================================="

          generated="docs/openapi.json docs/problem-types.json docs/event-categories.json"

          if [ -n "$(git status --porcelain -- $generated)" ]; then

            for file in $generated; do

              if [ -n "$(git status --porcelain -- "$file")" ]; then

                echo "::error file=$file::$file desatualizado. Execute ./mvnw verify e faça commit do arquivo."

              fi

            done

            git --no-pager diff --stat -- $generated

            exit 1

          fi

          echo "Documentação atualizada."

      # ==========================================
      # RELATÓRIOS
      # ==========================================

      - name: Publicar relatórios de testes e cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-testes-cobertura

          path: |
            target/surefire-reports/
            target/site/jacoco/

          retention-days: 14

          if-no-files-found: warn

      # ==========================================
      # GERAR SELO DE COBERTURA
      # ==========================================

      - name: Gerar selo de cobertura
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "=========================================="
          echo "GERANDO SELO DE COBERTURA"
          echo "=========================================="

          if [ ! -f target/site/jacoco/jacoco.csv ]; then
            echo "::error::Relatório JaCoCo não encontrado."
            exit 1
          fi

          pct=$(awk -F, '
            NR > 1 {
              missed += $8
              covered += $9
            }
            END {
              total = missed + covered

              if (total > 0) {
                printf "%d", (100 * covered / total)
              } else {
                printf "0"
              }
            }
          ' target/site/jacoco/jacoco.csv)

          echo "Cobertura total: ${pct}%"

          if [ "$pct" -ge 90 ]; then
            color="#4c1"
          elif [ "$pct" -ge 80 ]; then
            color="#97ca00"
          elif [ "$pct" -ge 70 ]; then
            color="#dfb317"
          else
            color="#e05d44"
          fi

          mkdir -p _site/badges

          cp -r target/site/jacoco _site/jacoco

          cat > _site/badges/coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="104" height="20" role="img" aria-label="coverage: ${pct}%">
            <title>coverage: ${pct}%</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="104" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="63" height="20" fill="#555"/>
              <rect x="63" width="41" height="20" fill="${color}"/>
              <rect width="104" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="31.5" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="31.5" y="14">coverage</text>
              <text x="83.5" y="15" fill="#010101" fill-opacity=".3">${pct}%</text>
              <text x="83.5" y="14">${pct}%</text>
            </g>
          </svg>
          EOF

          echo "Selo de cobertura gerado."

      # ==========================================
      # PREPARAR GITHUB PAGES
      # ==========================================

      - name: Preparar publicação no GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  # ==========================================
  # PUBLICAÇÃO DO RELATÓRIO
  # ==========================================

  coverage-badge:
    name: Publicar cobertura no GitHub Pages

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: test

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publicar selo e relatório no Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1