spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketfy}
spring.datasource.username=${DB_USERNAME:ticketfy_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET}

ticketfy.auth.access-token-minutes=10
ticketfy.auth.refresh-token-idle-minutes=30
ticketfy.auth.session-max-hours=12
ticketfy.auth.cookie-name=__Host-ticketfy_rt
ticketfy.auth.cookie-secure=true
ticketfy.auth.proxy-secret=${PROXY_SHARED_SECRET:}
ticketfy.auth.cleanup.retention-days=7

ticketfy.order.reservation-minutes=${ORDER_RESERVATION_MINUTES:15}
ticketfy.refund.deadline-hours=${REFUND_DEADLINE_HOURS:48}
ticketfy.dashboard.time-zone=${DASHBOARD_TIME_ZONE:America/Sao_Paulo}
ticketfy.payout.platform-fee-percent=${PLATFORM_FEE_PERCENT:5}
ticketfy.payout.release-delay-days=${PAYOUT_RELEASE_DELAY_DAYS:2}
ticketfy.payout.min-amount=${PAYOUT_MIN_AMOUNT:20.00}
ticketfy.payout.key-change-cooldown-hours=${PAYOUT_KEY_CHANGE_COOLDOWN_HOURS:48}
ticketfy.payout.stuck-after-minutes=${PAYOUT_STUCK_AFTER_MINUTES:10}
ticketfy.payout.review-threshold=${PAYOUT_REVIEW_THRESHOLD:5000.00}
ticketfy.payout.encryption-key=${PAYOUT_ENCRYPTION_KEY}
ticketfy.payout.development-encryption-key=dGlja2V0ZnktZGV2LW9ubHktbm90LWEtc2VjcmV0ISE=
ticketfy.password-confirmation.max-attempts=${PASSWORD_CONFIRMATION_MAX_ATTEMPTS:5}
ticketfy.password-confirmation.window-seconds=${PASSWORD_CONFIRMATION_WINDOW_SECONDS:900}
ticketfy.problems.base-uri=https://ticketfy-api.onrender.com/problems/
ticketfy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

ticketfy.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
ticketfy.login.window-seconds=${LOGIN_WINDOW_SECONDS:60}

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s