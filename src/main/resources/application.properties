spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketfy}
spring.datasource.username=${DB_USERNAME:ticketfy_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-hours=2

ticketfy.order.reservation-minutes=${ORDER_RESERVATION_MINUTES:15}