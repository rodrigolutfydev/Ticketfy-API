spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketfy}
    username: ${DB_USERNAME:ticketfy_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

api:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration-hours: 2