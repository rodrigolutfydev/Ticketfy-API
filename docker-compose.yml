services:

  # ==========================================
  # POSTGRESQL
  # ==========================================

  postgres:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-ticketfy}
      POSTGRES_USER: ${DB_USERNAME:-ticketfy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # TICKETFY API — JAVA
  # ==========================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    profiles:
      - app

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:

      # ======================================
      # SPRING BOOT
      # ======================================

      SPRING_PROFILES_ACTIVE: dev

      # ======================================
      # BANCO DE DADOS
      # ======================================

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ticketfy}

      DB_USERNAME: ${DB_USERNAME:-ticketfy_user}

      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

      # ======================================
      # AUTENTICAÇÃO
      # ======================================

      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}

      # ======================================
      # FRONTEND
      # ======================================

      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:5173}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # ======================================
      # MICROSSERVIÇO GO
      # ======================================

      PAYMENTS_GO_URL: ${PAYMENTS_GO_URL:-http://host.docker.internal:8081}

      PAYMENTS_INTERNAL_TOKEN: ${PAYMENTS_INTERNAL_TOKEN:?Defina PAYMENTS_INTERNAL_TOKEN no .env}

      # ======================================
      # OUTRAS CONFIGURAÇÕES
      # ======================================

      TZ: America/Sao_Paulo

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy


# ==========================================
# VOLUMES
# ==========================================

volumes:
  pgdata: